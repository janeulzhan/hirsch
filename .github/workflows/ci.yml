name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These are the versions the project claims to support. Keep this
        # matrix and requires-python in pyproject.toml in step with each
        # other; the README quotes both.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # Includes tests/test_memory.py, which is where an actual memory
      # regression would be caught. Those assertions are growth ratios and
      # first-principles predictions, never absolute byte counts, so they are
      # portable across runners by construction.
      - name: Test
        run: python -m pytest -q

      - name: Verify the CLI demo runs offline
        run: python -m hirsch.cli P69905 P68871 --offline --no-color

  benchlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # Checks the README against the raw CSV committed beside it. Nothing is
      # measured here, so the comparison is exact and identical on every
      # machine. Re-measuring tracemalloc peaks on a runner and comparing them
      # to figures recorded on different hardware would be comparing two
      # different things, and would allocate 600 MB to do it.
      - name: Check the README against the committed benchmark data
        run: python tools/benchlock.py --check --csv bench/results.csv
